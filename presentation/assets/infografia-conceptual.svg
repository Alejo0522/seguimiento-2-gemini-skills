<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <line x1="240" y1="0" x2="240" y2="680" />
    <line x1="480" y1="0" x2="480" y2="680" />
    <line x1="720" y1="0" x2="720" y2="680" />
    <line x1="960" y1="0" x2="960" y2="680" />
  </g>

  <!-- Title & Banner -->
  <rect x="80" y="40" width="1040" height="80" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.1)" />
  <text x="600" y="75" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700">
    FLUJO CONCEPTUAL: INTEGRACIÓN DE SKILLS DE GEMINI EN INGENIERÍA
  </text>
  <text x="600" y="102" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
    Arquitectura de 4 Fases: Desde el Requerimiento de Software hasta la Validación Automatizada
  </text>

  <!-- Connectors / Data Flow Arrows -->
  <path d="M 310 320 L 370 320" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 590 320 L 650 320" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 870 320 L 930 320" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Flow Arrows Heads -->
  <polygon points="370,314 382,320 370,326" fill="#8b5cf6" />
  <polygon points="650,314 662,320 650,326" fill="#8b5cf6" />
  <polygon points="930,314 942,320 930,326" fill="#06b6d4" />

  <!-- Node 1: Ingestion & Requirements -->
  <g transform="translate(90, 190)">
    <rect width="220" height="260" rx="14" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="1.5" />
    <circle cx="110" cy="50" r="30" fill="rgba(79, 70, 229, 0.2)" stroke="#4f46e5" stroke-width="1.5" />
    <text x="110" y="58" text-anchor="middle" font-size="24">💻</text>
    <text x="110" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. Requerimiento</text>
    <text x="110" y="130" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INPUT DE INGENIERÍA</text>
    <rect x="20" y="150" width="180" height="1" fill="rgba(255,255,255,0.1)" />
    <text x="30" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Modelo de Dominio</text>
    <text x="30" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Reglas y Casos de Uso</text>
    <text x="30" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Parámetros Técnicos</text>
  </g>

  <!-- Node 2: Skill Agent & Context -->
  <g transform="translate(370, 190)">
    <rect width="220" height="260" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="110" cy="50" r="30" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="110" y="58" text-anchor="middle" font-size="24">🧠</text>
    <text x="110" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">2. Gemini Skill</text>
    <text x="110" y="130" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROMPT &amp; REASONING</text>
    <rect x="20" y="150" width="180" height="1" fill="rgba(255,255,255,0.1)" />
    <text x="30" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Inferencia Semántica</text>
    <text x="30" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Selección de Herramientas</text>
    <text x="30" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Context Window 1M Tokens</text>
  </g>

  <!-- Node 3: Synthesis & Code Generation -->
  <g transform="translate(650, 190)">
    <rect width="220" height="260" rx="14" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="110" cy="50" r="30" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="110" y="58" text-anchor="middle" font-size="24">⚙️</text>
    <text x="110" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">3. Generación Técnica</text>
    <text x="110" y="130" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SÍNTESIS DE ARTEFACTOS</text>
    <rect x="20" y="150" width="180" height="1" fill="rgba(255,255,255,0.1)" />
    <text x="30" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Microservicios Go/Docker</text>
    <text x="30" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Scripts UFW &amp; iptables</text>
    <text x="30" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Queries SQL Optimizadas</text>
  </g>

  <!-- Node 4: Quality & Automated Verification -->
  <g transform="translate(930, 190)">
    <rect width="180" height="260" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="90" cy="50" r="30" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="58" text-anchor="middle" font-size="24">✅</text>
    <text x="90" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">4. Validación</text>
    <text x="90" y="130" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">QA &amp; TELEMETRÍA</text>
    <rect x="15" y="150" width="150" height="1" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Tests Unitarios</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Detección de Regresiones</text>
    <text x="25" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Métricas y Benchmarks</text>
  </g>

  <!-- Bottom Architecture Badge -->
  <rect x="180" y="520" width="840" height="90" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="600" y="555" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    CAPA DE PRESENTACIÓN (UI) ➔ CAPA DE LÓGICA DE NEGOCIO (Skill Service) ➔ CAPA DE ACCESO A DATOS (API Mock)
  </text>
  <text x="600" y="585" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
    Infografía conceptual generada con ChatGPT • Proyecto de Ingeniería Informática • 2026
  </text>
</svg>
